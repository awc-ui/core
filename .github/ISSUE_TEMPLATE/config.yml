# Blank issues stay on: not every report fits a form, and a bad form is worse
# than a free-form issue someone actually files.
blank_issues_enabled: true
contact_links:
  - name: Documentation
    url: https://awcui.io
    about: Component reference, guides, theming and the theme generator.
  - name: Question or idea
    url: https://github.com/awc-ui/core/discussions
    about: "\"How do I…\" and half-formed ideas belong in Discussions — no template, no triage."
  - name: Report a vulnerability
    url: https://github.com/awc-ui/core/security/advisories/new
    about: Please report security issues privately, not as a public issue.
