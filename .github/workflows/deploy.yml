name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  pull_request:
    branches: [main]
  # Manual production deploy of whatever ref it is dispatched on — for
  # bootstrapping the site and for re-deploys without waiting on a CI cycle.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs site (core + storybook + astro)
        run: bash scripts/build-docs.sh

      - name: Verify build outputs
        run: |
          test -f apps/docs/dist/index.html || (echo "::error::Missing apps/docs/dist/index.html" && exit 1)
          test -f apps/docs/dist/pagefind/pagefind.js || (echo "::error::Missing apps/docs/dist/pagefind/pagefind.js (Pagefind index not built)" && exit 1)
          test -f apps/docs/dist/storybook/index.html || (echo "::error::Missing apps/docs/dist/storybook/index.html (Storybook not embedded)" && exit 1)
          # Every framework build the showcase page links to. Without this the
          # site can deploy with the page advertising ten applications and the
          # URLs behind all of them returning 404 — which is exactly what
          # happened before build-docs.sh learned to build them.
          for fw in html astro react vue angular svelte; do
            test -f "apps/docs/dist/showcase/credit-risk/$fw/index.html" \
              || (echo "::error::Missing apps/docs/dist/showcase/credit-risk/$fw/index.html (showcase build not embedded)" && exit 1)
          done
          # The server-rendered builds fail the same way for the opposite
          # reason: there is deliberately no file to test for, so the only thing
          # between the dock's option for one of them and a 404 is a proxy in
          # apps/docs/netlify.toml — which is not in dist/, it is handed to the
          # deploy step below as netlify-config-path. And a file appearing at
          # that path would mean build-showcase.mjs staged a server build it was
          # supposed to skip — Netlify serves a matching file in preference to a
          # redirect, so the showcase would quietly serve build artifacts.
          # The wealth console's five. It ships no server-rendered build, so
          # there is no proxy half to this check — every one of its frameworks
          # is a directory of files and must be present.
          for fw in html react vue angular svelte; do
            test -f "apps/docs/dist/showcase/wealth/$fw/index.html" \
              || (echo "::error::Missing apps/docs/dist/showcase/wealth/$fw/index.html (showcase build not embedded)" && exit 1)
          done
          # And the banking app's five, on the same terms.
          for fw in html react vue angular svelte; do
            test -f "apps/docs/dist/showcase/banking/$fw/index.html" \
              || (echo "::error::Missing apps/docs/dist/showcase/banking/$fw/index.html (showcase build not embedded)" && exit 1)
          done
          # And Lyra's five. Same terms again: SPA-only, no server-rendered
          # build, so every framework is a directory of files and must exist.
          for fw in html react vue angular svelte; do
            test -f "apps/docs/dist/showcase/social/$fw/index.html" \
              || (echo "::error::Missing apps/docs/dist/showcase/social/$fw/index.html (showcase build not embedded)" && exit 1)
          done
          # And Corvus's five, on the same terms.
          for fw in html react vue angular svelte; do
            test -f "apps/docs/dist/showcase/community/$fw/index.html" \
              || (echo "::error::Missing apps/docs/dist/showcase/community/$fw/index.html (showcase build not embedded)" && exit 1)
          done
          # And Cygnus's five, on the same terms.
          for fw in html react vue angular svelte; do
            test -f "apps/docs/dist/showcase/music/$fw/index.html" \
              || (echo "::error::Missing apps/docs/dist/showcase/music/$fw/index.html (showcase build not embedded)" && exit 1)
          done
          for fw in next nuxt angular-ssr sveltekit; do
            grep -q "from = \"/showcase/credit-risk/$fw/\*\"" apps/docs/netlify.toml \
              || (echo "::error::apps/docs/netlify.toml has no proxy for /showcase/credit-risk/$fw/ — the showcase page links to it and it renders on a server, so every route under it would 404" && exit 1)
            test ! -e "apps/docs/dist/showcase/credit-risk/$fw" \
              || (echo "::error::apps/docs/dist/showcase/credit-risk/$fw exists — a server build was staged as static files, which shadows the proxy" && exit 1)
          done

      - name: Verify search, AI, npm, and GitHub discovery surfaces
        run: pnpm verify:discovery

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist/
          retention-days: 7

  deploy-preview:
    name: Deploy preview (PR)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist/

      - uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./apps/docs/dist
          production-deploy: false
          deploy-message: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          alias: pr-${{ github.event.pull_request.number }}
          enable-pull-request-comment: true
          enable-commit-comment: false
          netlify-config-path: ./apps/docs/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  deploy-production:
    name: Deploy production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist/

      - uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./apps/docs/dist
          production-deploy: true
          deploy-message: "Deploy ${{ github.event.workflow_run.head_sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
          netlify-config-path: ./apps/docs/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
