name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  pull_request:
    branches: [main]
  # Manual production deploy of whatever ref it is dispatched on — for
  # bootstrapping the site and for re-deploys without waiting on a CI cycle.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs site (core + storybook + astro)
        run: bash scripts/build-docs.sh

      - name: Verify build outputs
        run: |
          test -f apps/docs/dist/index.html || (echo "::error::Missing apps/docs/dist/index.html" && exit 1)
          test -f apps/docs/dist/pagefind/pagefind.js || (echo "::error::Missing apps/docs/dist/pagefind/pagefind.js (Pagefind index not built)" && exit 1)
          test -f apps/docs/dist/storybook/index.html || (echo "::error::Missing apps/docs/dist/storybook/index.html (Storybook not embedded)" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist/
          retention-days: 7

  deploy-preview:
    name: Deploy preview (PR)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist/

      - uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./apps/docs/dist
          production-deploy: false
          deploy-message: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          alias: pr-${{ github.event.pull_request.number }}
          enable-pull-request-comment: true
          enable-commit-comment: false
          netlify-config-path: ./apps/docs/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  deploy-production:
    name: Deploy production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist/

      - uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./apps/docs/dist
          production-deploy: true
          deploy-message: "Deploy ${{ github.event.workflow_run.head_sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
          netlify-config-path: ./apps/docs/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
