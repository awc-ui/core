# Manual npm publishing for the @awc-ui packages.
#
# Trigger from the Actions tab (or `gh workflow run publish.yml`):
#   channel=snapshot  — auto-versioned 0.0.0-snapshot.<utc>.<sha> under the
#                       `snapshot` dist-tag. Allowed from any branch; nothing
#                       is committed. For trying a build straight off a ref:
#                       npm i @awc-ui/core@snapshot
#   channel=beta      — your prerelease version (e.g. 1.0.0-beta.1) under the
#                       `beta` dist-tag:  npm i @awc-ui/core@beta
#   channel=prod      — plain semver (e.g. 1.0.0) under `latest`.
# beta and prod must be dispatched on main; they also commit the version
# bump back, tag v<version>, and create a GitHub release.
#
# Published set: core, tokens, react, vue, angular, svelte, theme, mcp.
#
# Versions are stamped into the manifests BEFORE the build because
# ng-packagr bakes the version into packages/angular/dist/package.json, and
# the workspace:* peer ranges rewrite to the stamped version at publish time
# (verified with pnpm pack), so only the version fields need setting.
#
# authentication=trusted is the default: GitHub OIDC without a stored npm token.
# authentication=token is an explicit legacy fallback for separate dist-tag writes.
# See docs/npm-trusted-publishing.md for package setup and release verification.

name: Publish

on:
  workflow_dispatch:
    inputs:
      authentication:
        description: 'npm authentication (trusted requires package setup; token supports extra dist-tag updates)'
        required: true
        type: choice
        default: trusted
        options:
          - trusted
          - token
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - snapshot
          - beta
          - prod
      version:
        description: 'Version for beta/prod (e.g. 1.0.0-beta.1 or 1.0.0). Ignored for snapshot.'
        required: false
        type: string
      promote_latest:
        description: 'Also move the `latest` dist-tag to this version (beta/prod only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Current npm 11 maintenance release, checked against npm's official
  # changelog on 2026-09-06. OIDC requires npm >=11.5.1 and Node >=22.14.
  TRUSTED_NPM_VERSION: '11.19.1'
  PUBLISH_FILTERS: >-
    --filter @awc-ui/core
    --filter @awc-ui/tokens
    --filter @awc-ui/react
    --filter @awc-ui/vue
    --filter @awc-ui/angular
    --filter @awc-ui/svelte
    --filter @awc-ui/theme
    --filter @awc-ui/mcp

jobs:
  publish:
    name: Publish (${{ inputs.channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Start CI explicitly after the bot's archive commit (bot pushes do not
      # trigger push workflows). Successful CI then starts the docs deployment.
      actions: write
      # Required for Trusted Publishing authentication and npm provenance.
      id-token: write
    steps:
      - name: beta/prod release only from main
        if: inputs.channel != 'snapshot' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::${{ inputs.channel }} releases must be dispatched on main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with Trusted Publishing support
        if: inputs.authentication == 'trusted'
        run: npm install --global "npm@$TRUSTED_NPM_VERSION" --registry=https://registry.npmjs.org --ignore-scripts

      - run: pnpm install --frozen-lockfile

      - name: Resolve version and dist-tag
        id: rv
        env:
          CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$CHANNEL" in
            snapshot)
              VERSION="0.0.0-snapshot.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
              TAG=snapshot
              ;;
            beta)
              if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
                echo "::error::beta needs a prerelease version like 1.0.0-beta.1 (got '$INPUT_VERSION')"
                exit 1
              fi
              VERSION="$INPUT_VERSION"
              TAG=beta
              ;;
            prod)
              if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::prod needs a plain version like 1.0.0 (got '$INPUT_VERSION')"
                exit 1
              fi
              VERSION="$INPUT_VERSION"
              TAG=latest
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag $TAG"

      - name: Validate publishing authentication and tag plan
        env:
          AUTHENTICATION: ${{ inputs.authentication }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ steps.rv.outputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          node --test scripts/check-publish-auth.test.mjs
          node scripts/check-publish-auth.mjs

      - name: Stamp package versions
        run: |
          for p in core tokens react vue angular svelte theme mcp; do
            (cd "packages/$p" && npm pkg set version='${{ steps.rv.outputs.version }}')
          done

      - name: Build
        run: |
          pnpm generate:docs
          pnpm --filter @awc-ui/core build
          pnpm ci:wrappers
          pnpm test:mcp

      # Full test suite before anything reaches npm — including the
      # Playwright CT and Storybook gates further down. Those two used to be
      # left to the push-triggered CI on main, on the reasoning that releases
      # are dispatched from a green main. 1.0.0-beta.5 disproved it: it was
      # dispatched from a main whose CI had not finished, and shipped a
      # regression neither the spec nor e2e suites can see.
      - name: SSR gate (renderToString every component + DSD)
        run: pnpm --filter @awc-ui/core test:ssr

      - name: Spec tests
        # jest-direct path — `stencil test --spec --coverage` wedges, and this
        # config caps worker heap (see jest.coverage.config.cjs).
        run: pnpm --filter @awc-ui/core test:spec:coverage

      - name: Install chrome-headless-shell for Puppeteer
        run: pnpm --filter @awc-ui/core exec puppeteer browsers install chrome-headless-shell

      - name: E2E tests
        run: pnpm --filter @awc-ui/core exec stencil test --e2e --ci --max-workers=2

      # WHY THESE ARE HERE: 1.0.0-beta.5 shipped a real regression — a
      # link-button stopped responding to Enter, Space and el.click() — with
      # every gate above green. The Stencil spec and e2e suites test the
      # components in isolation; they cannot see a framework wrapper breaking,
      # and they do not run the Storybook play functions. The bug was caught
      # by the Link Button story, hours after publishing. These two steps are
      # the ones that would have stopped it.
      - name: Install chromium for component tests
        run: pnpm --filter @awc-ui/test-react exec playwright install chromium --with-deps

      - name: Component tests (Playwright CT, React wrappers)
        # test:ct rebuilds @awc-ui/core itself first, so it runs against the
        # same source this release is publishing.
        run: pnpm --filter @awc-ui/test-react test:ct

      - name: Story behaviour + accessibility (Storybook play functions + axe)
        # build-storybook first: test:a11y drives the stories through vitest
        # browser mode and needs the built storybook, which CI gets from a
        # separate job's artifact and this single-job workflow must build.
        run: |
          pnpm --filter @awc-ui/storybook build-storybook
          pnpm --filter @awc-ui/storybook test:a11y

      # `stencil test --e2e` runs its own DEV build and re-emits every output
      # target into dist/ — unminified, unhashed, lazy runtime, global
      # stylesheet baked into the custom-elements bundle. Entry filenames
      # collide with the prod build's, so the dev output silently wins and
      # that is what v1.0.0-beta.1 shipped. Rebuild after all test gates so
      # npm gets the prod artifacts (the core build script now cleans dist/
      # first, so no stale files survive either).
      - name: Rebuild production packages after tests
        run: |
          pnpm --filter @awc-ui/core build
          pnpm ci:wrappers
          pnpm test:mcp

      - name: Install Chromium for standalone starter verification
        run: pnpm exec puppeteer browsers install chrome

      - name: Consumer, adapter and installation gates
        run: |
          pnpm verify:contributor
          pnpm test:cli
          pnpm --filter @awc-ui/docs test
          pnpm docs:versions:check
          pnpm test:adapters
          pnpm test:ssr-contracts
          pnpm verify:consumer-types
          node --test scripts/compact-sourcemaps.test.mjs scripts/side-effects.test.mjs
          pnpm verify:package-size
          pnpm verify:starters

      - name: Assert custom-elements output is clean
        run: |
          for d in packages/core/dist/components packages/core/dist/components-csr; do
            if grep -l "entry\.js" "$d"/*.js; then
              echo "::error::$d references the lazy loader — a dev build leaked into dist/"
              exit 1
            fi
            if grep -l "Design Tokens" "$d"/*.js; then
              echo "::error::$d has the global stylesheet baked in — a dev build leaked into dist/"
              exit 1
            fi
          done
          # The CSR build's whole point is compiling out SSR hydration support.
          if grep -l "hydrateClientSide:true" packages/core/dist/components-csr/*.js; then
            echo "::error::dist/components-csr still contains client-hydration support — CSR build misconfigured"
            exit 1
          fi
          echo "custom-elements outputs are clean"

      - name: Publish-readiness gate (publint + attw)
        run: |
          pnpm ci:publint
          pnpm ci:attw

      - name: Size budgets (size-limit)
        # Consumer-shaped bundle budgets: a lost sideEffects field, a dev
        # build leaking into dist, or a new eager dependency fails here
        # instead of silently costing every consumer hundreds of kB.
        run: pnpm ci:size

      - name: Recheck trusted publishing tag plan
        if: inputs.authentication == 'trusted'
        # Builds/tests can take a while; refresh the public tag checks before
        # publishing the first package in case the registry changed meanwhile.
        env:
          AUTHENTICATION: ${{ inputs.authentication }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ steps.rv.outputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: node scripts/check-publish-auth.mjs

      - name: Publish to npm (token)
        if: inputs.authentication == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with a sigstore provenance attestation, which npm surfaces
          # on the package page as "Built and signed on GitHub Actions" with
          # the commit and workflow that produced the tarball.
          #
          # Set as npm CONFIG rather than a `--provenance` flag on purpose:
          # `pnpm publish` shells out to `npm publish` and this reaches npm
          # regardless of how pnpm forwards argv (pnpm's own --help does not
          # even list the flag). Requires id-token: write above, a public
          # package, and a `repository` field matching this repo — all seven
          # packages already carry one.
          NPM_CONFIG_PROVENANCE: 'true'
        run: >-
          pnpm -r ${{ env.PUBLISH_FILTERS }} publish
          --access public
          --tag ${{ steps.rv.outputs.tag }}
          --no-git-checks

      - name: Publish to npm (Trusted Publishing)
        if: inputs.authentication == 'trusted'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        # pnpm creates the publish tarballs (including workspace peer ranges
        # and Angular's publishConfig.directory) then invokes the chosen npm.
        # npm performs the OIDC exchange. No npm token is passed to this step.
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_AUTH_TOKEN
          # pnpm otherwise prepends node's bin directory to PATH and could
          # choose a different npm from the one installed/validated above.
          export npm_config_npm_path="$(command -v npm)"
          pnpm -r ${{ env.PUBLISH_FILTERS }} publish \
            --access public \
            --tag ${{ steps.rv.outputs.tag }} \
            --no-git-checks

      - name: Heal bootstrap latest tag (beta/prod)
        # npm forcibly assigns `latest` on a package's FIRST publish even when
        # --tag says otherwise, so the inaugural snapshot run left `latest`
        # pointing at 0.0.0-snapshot.* — a plain `npm i @awc-ui/core` installed
        # the snapshot. Whenever a real release publishes, move any
        # snapshot-held `latest` to this version. A `latest` that already
        # points at a real release never matches and is never touched.
        # Trusted-mode tag repairs are rejected by the preflight, before any
        # package is published. OIDC cannot authenticate npm dist-tag.
        if: inputs.authentication == 'token' && inputs.channel != 'snapshot'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          for p in core tokens react vue angular svelte theme mcp; do
            latest=$(npm view "@awc-ui/$p" dist-tags.latest 2>/dev/null || echo "")
            if [[ "$latest" == 0.0.0-snapshot.* ]]; then
              echo "@awc-ui/$p: latest=$latest -> $VERSION"
              npm dist-tag add "@awc-ui/$p@$VERSION" latest
            fi
          done

      - name: Promote latest dist-tag
        # Opt-in via the promote_latest input: point `latest` at this release
        # so a plain `npm i @awc-ui/<pkg>` installs it. Useful while the
        # project's public builds are prereleases and `latest` would otherwise
        # sit on an old beta forever.
        if: inputs.authentication == 'token' && inputs.channel != 'snapshot' && inputs.promote_latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          for p in core tokens react vue angular svelte theme mcp; do
            npm dist-tag add "@awc-ui/$p@$VERSION" latest
          done

      - name: Commit bump, tag, and GitHub release (beta/prod)
        if: inputs.channel != 'snapshot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          # Preserve the generated API/manuals that were actually packaged.
          git add packages/core/custom-elements.json packages/core/src/components.d.ts
          git add -u -- 'packages/core/src/components/*/readme.md'
          # main may already carry this exact version (a local prep commit),
          # leaving nothing staged — a bare `git commit` would exit 1 here,
          # killing the step AFTER npm publish succeeded and skipping tag+release.
          if git diff --cached --quiet; then
            echo "versions already at v$VERSION on main; skipping bump commit"
          else
            git commit -m "chore(release): v$VERSION"
          fi
          # A re-run of an already-tagged version (e.g. to publish packages
          # added to the set later — pnpm -r publish skips versions the
          # registry already has) must not die on the existing tag/release.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; skipping tag + release"
          else
            # Tag the exact built source BEFORE incorporating a newer main.
            # Rebase may move the branch, but this tag keeps release provenance.
            git tag "v$VERSION"
            git push origin "v$VERSION"
            PRERELEASE=""
            if [ "${{ inputs.channel }}" = "beta" ]; then PRERELEASE="--prerelease"; fi
            gh release create "v$VERSION" --generate-notes $PRERELEASE
          fi
          # Generated build outputs may remain dirty; preserve them across the
          # rebase. The immutable tag continues to identify the published tree.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Archive released documentation (beta/prod)
        if: inputs.channel != 'snapshot'
        env:
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          # Read the immutable release commit, never the newer working tree.
          # Archives live in Git so every future deployment retains them.
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          node scripts/snapshot-docs.mjs --ref "v$VERSION"
          node scripts/snapshot-docs.mjs --check
          git add apps/docs/versions/
          if ! git diff --cached --quiet; then
            git commit -m "docs: archive reference for v$VERSION"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Validate and deploy the archived documentation
        if: inputs.channel != 'snapshot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main

      - name: Summary
        run: |
          {
            echo "### Published ${{ steps.rv.outputs.version }} (dist-tag: ${{ steps.rv.outputs.tag }})"
            echo "Authentication: ${{ inputs.authentication }}"
            echo ""
            for p in core tokens react vue angular svelte theme mcp; do
              echo "- \`@awc-ui/$p@${{ steps.rv.outputs.version }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
