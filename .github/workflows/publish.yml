# Manual npm publishing for the @awc-ui packages.
#
# Trigger from the Actions tab (or `gh workflow run publish.yml`):
#   channel=snapshot  — auto-versioned 0.0.0-snapshot.<utc>.<sha> under the
#                       `snapshot` dist-tag. Allowed from any branch; nothing
#                       is committed. For trying a build straight off a ref:
#                       npm i @awc-ui/core@snapshot
#   channel=beta      — your prerelease version (e.g. 1.0.0-beta.1) under the
#                       `beta` dist-tag:  npm i @awc-ui/core@beta
#   channel=prod      — plain semver (e.g. 1.0.0) under `latest`.
# beta and prod must be dispatched on main; they also commit the version
# bump back, tag v<version>, and create a GitHub release.
#
# Published set: core, tokens, react, vue, angular, svelte, theme.
#
# Versions are stamped into the manifests BEFORE the build because
# ng-packagr bakes the version into packages/angular/dist/package.json, and
# the workspace:* peer ranges rewrite to the stamped version at publish time
# (verified with pnpm pack), so only the version fields need setting.
#
# Requires the NPM_TOKEN repo secret: an npm Granular Access Token with
# read/write on the @awc-ui scope (npmjs.com → Access Tokens).

name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - snapshot
          - beta
          - prod
      version:
        description: 'Version for beta/prod (e.g. 1.0.0-beta.1 or 1.0.0). Ignored for snapshot.'
        required: false
        type: string
      promote_latest:
        description: 'Also move the `latest` dist-tag to this version (beta/prod only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PUBLISH_FILTERS: >-
    --filter @awc-ui/core
    --filter @awc-ui/tokens
    --filter @awc-ui/react
    --filter @awc-ui/vue
    --filter @awc-ui/angular
    --filter @awc-ui/svelte
    --filter @awc-ui/theme

jobs:
  publish:
    name: Publish (${{ inputs.channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: beta/prod release only from main
        if: inputs.channel != 'snapshot' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::${{ inputs.channel }} releases must be dispatched on main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Resolve version and dist-tag
        id: rv
        env:
          CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$CHANNEL" in
            snapshot)
              VERSION="0.0.0-snapshot.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
              TAG=snapshot
              ;;
            beta)
              if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
                echo "::error::beta needs a prerelease version like 1.0.0-beta.1 (got '$INPUT_VERSION')"
                exit 1
              fi
              VERSION="$INPUT_VERSION"
              TAG=beta
              ;;
            prod)
              if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::prod needs a plain version like 1.0.0 (got '$INPUT_VERSION')"
                exit 1
              fi
              VERSION="$INPUT_VERSION"
              TAG=latest
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag $TAG"

      - name: Stamp package versions
        run: |
          for p in core tokens react vue angular svelte theme; do
            (cd "packages/$p" && npm pkg set version='${{ steps.rv.outputs.version }}')
          done

      - name: Build
        run: |
          pnpm --filter @awc-ui/core build
          pnpm ci:wrappers

      # Full core test suite before anything reaches npm. Storybook a11y and
      # Playwright CT are deliberately NOT repeated here — they gate every
      # push on main, and releases are dispatched from a green main.
      - name: SSR gate (renderToString every component + DSD)
        run: pnpm --filter @awc-ui/core test:ssr

      - name: Spec tests
        # jest-direct path — `stencil test --spec --coverage` wedges, and this
        # config caps worker heap (see jest.coverage.config.cjs).
        run: pnpm --filter @awc-ui/core test:spec:coverage

      - name: Install chrome-headless-shell for Puppeteer
        run: pnpm --filter @awc-ui/core exec puppeteer browsers install chrome-headless-shell

      - name: E2E tests
        run: pnpm --filter @awc-ui/core exec stencil test --e2e --ci --max-workers=2

      # `stencil test --e2e` runs its own DEV build and re-emits every output
      # target into dist/ — unminified, unhashed, lazy runtime, global
      # stylesheet baked into the custom-elements bundle. Entry filenames
      # collide with the prod build's, so the dev output silently wins and
      # that is what v1.0.0-beta.1 shipped. Rebuild after all test gates so
      # npm gets the prod artifacts (the core build script now cleans dist/
      # first, so no stale files survive either).
      - name: Rebuild dist for publish (e2e overwrites it with a dev build)
        run: pnpm --filter @awc-ui/core build

      - name: Assert custom-elements output is clean
        run: |
          cd packages/core/dist/components
          if grep -l "entry\.js" ./*.js; then
            echo "::error::custom-elements output references the lazy loader — a dev build leaked into dist/"
            exit 1
          fi
          if grep -l "Design Tokens" ./*.js; then
            echo "::error::custom-elements output has the global stylesheet baked in — a dev build leaked into dist/"
            exit 1
          fi
          echo "custom-elements output is clean"

      - name: Publish-readiness gate (publint + attw)
        run: |
          pnpm ci:publint
          pnpm ci:attw

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          pnpm -r ${{ env.PUBLISH_FILTERS }} publish
          --access public
          --tag ${{ steps.rv.outputs.tag }}
          --no-git-checks

      - name: Heal bootstrap latest tag (beta/prod)
        # npm forcibly assigns `latest` on a package's FIRST publish even when
        # --tag says otherwise, so the inaugural snapshot run left `latest`
        # pointing at 0.0.0-snapshot.* — a plain `npm i @awc-ui/core` installed
        # the snapshot. Whenever a real release publishes, move any
        # snapshot-held `latest` to this version. A `latest` that already
        # points at a real release never matches and is never touched.
        if: inputs.channel != 'snapshot'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          for p in core tokens react vue angular svelte theme; do
            latest=$(npm view "@awc-ui/$p" dist-tags.latest 2>/dev/null || echo "")
            if [[ "$latest" == 0.0.0-snapshot.* ]]; then
              echo "@awc-ui/$p: latest=$latest -> $VERSION"
              npm dist-tag add "@awc-ui/$p@$VERSION" latest
            fi
          done

      - name: Promote latest dist-tag
        # Opt-in via the promote_latest input: point `latest` at this release
        # so a plain `npm i @awc-ui/<pkg>` installs it. Useful while the
        # project's public builds are prereleases and `latest` would otherwise
        # sit on an old beta forever.
        if: inputs.channel != 'snapshot' && inputs.promote_latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          for p in core tokens react vue angular svelte theme; do
            npm dist-tag add "@awc-ui/$p@$VERSION" latest
          done

      - name: Commit bump, tag, and GitHub release (beta/prod)
        if: inputs.channel != 'snapshot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          # main may already carry this exact version (a local prep commit),
          # leaving nothing staged — a bare `git commit` would exit 1 here,
          # killing the step AFTER npm publish succeeded and skipping tag+release.
          if git diff --cached --quiet; then
            echo "versions already at v$VERSION on main; skipping bump commit"
          else
            git commit -m "chore(release): v$VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # A re-run of an already-tagged version (e.g. to publish packages
          # added to the set later — pnpm -r publish skips versions the
          # registry already has) must not die on the existing tag/release.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; skipping tag + release"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            PRERELEASE=""
            if [ "${{ inputs.channel }}" = "beta" ]; then PRERELEASE="--prerelease"; fi
            gh release create "v$VERSION" --generate-notes $PRERELEASE
          fi

      - name: Summary
        run: |
          {
            echo "### Published ${{ steps.rv.outputs.version }} (dist-tag: ${{ steps.rv.outputs.tag }})"
            echo ""
            for p in core tokens react vue angular svelte theme; do
              echo "- \`@awc-ui/$p@${{ steps.rv.outputs.version }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
