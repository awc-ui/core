<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<style>
  /* applyFontFamily() sets the --md-sys-typescale-*-font-family TOKENS on <html>,
     which components read — but raw story-authored HTML (KPI numbers, labels)
     has no font-family and would otherwise fall back to the browser SERIF
     default. Inherit the app font onto the story body so that HTML matches. */
  body {
    font-family: var(--md-sys-typescale-body-medium-font-family, Roboto, system-ui, sans-serif);
  }
</style>
