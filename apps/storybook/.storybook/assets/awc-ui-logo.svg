     wordmark. Wordmark color follows prefers-color-scheme like the Storybook
     manager theme's inline logo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="36" viewBox="0 0 128 36" fill="none" role="img" aria-label="AWC UI">
  <defs>
    <linearGradient id="awc-logo-bg" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D0BCFF"/>
