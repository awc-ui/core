<!doctype html>
<html lang="en" dir="ltr" data-density="-1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c3b66" />
    <meta
      name="description"
      content="Vela — a pharmaceutical laboratory testing workspace, built with AWC UI. Interactive demo with fictional data."
    />
    <title>Vela · Pharmaceutical testing workspace</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="preload"
      href="./fonts/roboto-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./awc/md3.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
    <style id="vela-primary-theme"></style>
    <script src="./preboot.js"></script>
    <script type="module" src="./awc/md3.esm.js"></script>
    <script type="module" src="./bootstrap.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <main id="main" class="startup" aria-busy="true">
        <p class="eyebrow">Vela / Research operations</p>
        <md-skeleton
          width="240px"
          height="44px"
          aria-label="Loading your research workspace"
        ></md-skeleton
        ><md-skeleton
          variant="rounded"
          height="320px"
          full-width
          announce="false"
        ></md-skeleton>
      </main>
    </div>
    <div id="overlays"></div>
    <md-snackbar
      id="toast"
      position="bottom-end"
      closeable
      auto-hide-duration="5000"
    ></md-snackbar
    ><noscript
      >Enable JavaScript to use the Vela demonstration workspace.</noscript
    >
  </body>
</html>
