# This file is NOT copied into the publish dir. It reaches Netlify because
# .github/workflows/deploy.yml passes it as `netlify-config-path`, so a rule
# added here takes effect on the next deploy and nowhere else — editing the
# copy under dist/ would do nothing, because there isn't one.
# Only [[headers]] and [[redirects]] apply at runtime.
# The build is orchestrated by .github/workflows/deploy.yml (see Story 4.7).
# If you ever re-enable Netlify Git integration as a fallback, add a [build] section
# here pointing to `bash scripts/build-docs.sh` and disable the deploy workflow.

[[headers]]
  for = "/storybook/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/storybook"
  to = "/storybook/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Server-rendered showcase builds.
#
# These MUST come before the two static rules below, because first match wins
# and `/showcase/:app/:framework/*` would otherwise rewrite them to an
# index.html that deliberately does not exist — a 404 on every SSR route.
#
# `force = true` because there is nothing on disk at this path and there must
# not be: build-showcase.mjs stages nothing for a server build, and actively
# deletes anything stale it finds there. Without `force`, a file appearing at
# that path later would silently win over the proxy and serve build artifacts
# instead of the rendered app.
#
# The base path is preserved through the proxy. Each app is compiled against
# its own prefix — Next's `basePath`, Nuxt's `app.baseURL`, SvelteKit's
# `paths.base`, Angular's `baseHref` — so it expects to RECEIVE that prefix and
# emits it in every asset URL it renders. Stripping it here would break every
# link and every asset on the page.
#
# EACH ORIGIN BELOW MUST MATCH THE NAME OF THE NETLIFY SITE THAT BUILD IS
# DEPLOYED TO. They are plain hostnames on purpose: netlify.toml does not
# interpolate environment variables, so the alternative is generating this file
# at build time, which hides the routing somewhere less obvious than the file
# that implements it. `.github/workflows/deploy.yml` asserts a rule exists for
# every server-rendered build, so a build added without one fails CI rather
# than 404ing in production — but nothing can check that a hostname is the
# RIGHT one until the site exists.
# NEXT IS ROUTED DIFFERENTLY FROM THE OTHER THREE, and the reason is a real
# constraint rather than a preference: A NETLIFY-TO-NETLIFY PROXY REACHES THE
# TARGET'S SERVERLESS FUNCTIONS BUT SKIPS ITS EDGE FUNCTIONS.
#
# Nuxt, SvelteKit and Angular all inject declarative shadow DOM inside their
# serverless function, so proxying them works untouched — measured at 95 shadow
# roots on /stress/ both direct and through here. Next cannot: its transform
# needs Node (the hydrate pass is ~140 ms, far past the 50 ms CPU budget of
# Netlify's Deno edge), so the app uses edge middleware to REWRITE document
# requests to a Node route handler. That middleware never runs on a proxied
# request, so this path served bare custom elements — a page that looks
# plausible and carries zero shadow roots.
#
# So the rewrite the middleware would have done is done HERE instead, by asking
# the route handler for the document directly. It takes the wanted path as `?p=`,
# a parameter that exists precisely because it survives a proxy that rewrites
# headers. Verified through this proxy: 206 on the overview, 297 on the
# watchlist, 95 on stress — identical to the local Node server.
#
# THE ASSET RULES MUST COME FIRST. Without them every hashed chunk and every
# runtime file would be handed to the renderer, which would try to render a
# JavaScript URL as a page.
[[redirects]]
  from = "/showcase/credit-risk/next/_next/*"
  to = "https://awc-credit-risk-next.netlify.app/showcase/credit-risk/next/_next/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/next/awc-runtime/*"
  to = "https://awc-credit-risk-next.netlify.app/showcase/credit-risk/next/awc-runtime/:splat"
  status = 200
  force = true

# The handler itself, so it stays reachable for debugging and so the rule below
# cannot recurse into it.
[[redirects]]
  from = "/showcase/credit-risk/next/awc-dsd/*"
  to = "https://awc-credit-risk-next.netlify.app/showcase/credit-risk/next/awc-dsd/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/next/*"
  to = "https://awc-credit-risk-next.netlify.app/showcase/credit-risk/next/awc-dsd/?p=/showcase/credit-risk/next/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/next"
  to = "https://awc-credit-risk-next.netlify.app/showcase/credit-risk/next/"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/nuxt/*"
  to = "https://awc-credit-risk-nuxt.netlify.app/showcase/credit-risk/nuxt/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/nuxt"
  to = "https://awc-credit-risk-nuxt.netlify.app/showcase/credit-risk/nuxt/"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/angular-ssr/*"
  to = "https://awc-credit-risk-angular-ssr.netlify.app/showcase/credit-risk/angular-ssr/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/angular-ssr"
  to = "https://awc-credit-risk-angular-ssr.netlify.app/showcase/credit-risk/angular-ssr/"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/sveltekit/*"
  to = "https://awc-credit-risk-sveltekit.netlify.app/showcase/credit-risk/sveltekit/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/showcase/credit-risk/sveltekit"
  to = "https://awc-credit-risk-sveltekit.netlify.app/showcase/credit-risk/sveltekit/"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# Showcase applications are built separately and copied into public/showcase/
# <app>/<framework>/ before the Astro build, the same way Storybook is. Netlify
# resolves a directory request to its index.html on its own, but the extension-
# less variant (no trailing slash) needs saying explicitly — otherwise it falls
# through to Starlight's 404 for the docs route that owns the parent path.
[[redirects]]
  from = "/showcase/:app/:framework"
  to = "/showcase/:app/:framework/index.html"
  status = 200

# The same thing for every screen BELOW a framework's root, which the rule above
# does not reach: /showcase/credit-risk/astro/counterparties/cp-01 is four
# segments deep, and the locale-routed builds add another
# (/showcase/credit-risk/astro/ro/watchlist).
#
# Safe as a catch-all because a rewrite without `force` only applies when no
# static file matches the path, so real assets — the runtime chunks under
# awc-runtime/, Astro's hashed bundles under _astro/ — are served directly and
# never reach this rule. Every route the apps link to internally already ends in
# a slash; this is for hand-typed and shared URLs.
[[redirects]]
  from = "/showcase/:app/:framework/*"
  to = "/showcase/:app/:framework/:splat/index.html"
  status = 200
