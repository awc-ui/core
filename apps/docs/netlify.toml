# This file ships in the publish dir; only [[headers]] and [[redirects]] apply at runtime.
# The build is orchestrated by .github/workflows/deploy.yml (see Story 4.7).
# If you ever re-enable Netlify Git integration as a fallback, add a [build] section
# here pointing to `bash scripts/build-docs.sh` and disable the deploy workflow.

[[headers]]
  for = "/storybook/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/storybook"
  to = "/storybook/index.html"
  status = 200

# Showcase applications are built separately and copied into public/showcase/
# <app>/<framework>/ before the Astro build, the same way Storybook is. Netlify
# resolves a directory request to its index.html on its own, but the extension-
# less variant (no trailing slash) needs saying explicitly — otherwise it falls
# through to Starlight's 404 for the docs route that owns the parent path.
[[redirects]]
  from = "/showcase/:app/:framework"
  to = "/showcase/:app/:framework/index.html"
  status = 200
